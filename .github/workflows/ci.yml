name: ci
# Lint + offline tests. Tests use synthetic panels only; no network, no secrets.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install duckdb numpy pandas pyarrow pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
