[project]
name = "piotroski-liquidity-research"
version = "0.1.0"
description = "Point-in-time backtests: is the Piotroski F-score premium conditioned by size or by liquidity?"
requires-python = ">=3.9"
dependencies = ["duckdb", "numpy", "pandas", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
extend-exclude = ["graphify-out", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Research scripts keep numpy/pandas imports after warnings.filterwarnings(...)
ignore = ["E402", "E701", "E702", "E741"]
